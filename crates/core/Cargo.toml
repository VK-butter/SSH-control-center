[package]
name = "sshcc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core library for SSH Control Center: pairing, fleet registry, jobs, files, terminals and the MCP tool surface."

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
rusqlite.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
flate2.workspace = true
tar.workspace = true
portable-pty = "0.9"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation","Win32_Security","Win32_Security_Authorization","Win32_System_Threading","Win32_System_Pipes","Win32_System_IO","Win32_Storage_FileSystem","Win32_System_JobObjects","Win32_System_Services","Win32_System_Memory","Win32_System_RemoteDesktop","Win32_System_Environment","Win32_UI_Shell","Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
