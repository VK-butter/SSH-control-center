[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "desktop/src-tauri"]
default-members = ["crates/core", "crates/cli"]
[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"
authors = ["VK-butter"]
repository = "https://github.com/VK-butter/SSH-control-center"
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"

flate2 = "1"
tar = "0.4"
