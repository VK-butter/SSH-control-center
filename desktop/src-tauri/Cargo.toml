[package]
name = "sshcc-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "SSH Control Center tray and native management window"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sshcc-core = { path = "../../crates/core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
tray-icon = { version = "0.25.1", default-features = false, features = ["libappindicator"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects"] }
